services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payment_dev_password}
      POSTGRES_DB: payment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        for topic in payment-events payment-events-dlq; do
          if ! /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list | grep -qx "$$topic"; then
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --topic "$$topic" --partitions 3 --replication-factor 1
          fi
        done

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["./migrate"]
    environment:
      DATABASE_URL: postgres://payment:${POSTGRES_PASSWORD:-payment_dev_password}@postgres:5432/payment?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["./api"]
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://payment:${POSTGRES_PASSWORD:-payment_dev_password}@postgres:5432/payment?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  publisher:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["./publisher"]
    environment:
      DATABASE_URL: postgres://payment:${POSTGRES_PASSWORD:-payment_dev_password}@postgres:5432/payment?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OUTBOX_POLL_INTERVAL: 1s
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  consumer:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["./consumer"]
    environment:
      DATABASE_URL: postgres://payment:${POSTGRES_PASSWORD:-payment_dev_password}@postgres:5432/payment?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      PAYMENT_CONSUMER_GROUP: payment-processor
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  analytics-consumer:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["./analytics-consumer"]
    environment:
      DATABASE_URL: postgres://payment:${POSTGRES_PASSWORD:-payment_dev_password}@postgres:5432/payment?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      ANALYTICS_CONSUMER_GROUP: payment-analytics
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  integration-tests:
    profiles: [test]
    build:
      context: ..
      dockerfile: Dockerfile
      target: build
    working_dir: /src
    command: ["go", "test", "-v", "-count=1", "./internal/repository"]
    environment:
      TEST_DATABASE_URL: postgres://payment:${POSTGRES_PASSWORD:-payment_dev_password}@postgres:5432/payment?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  kafka_data:
